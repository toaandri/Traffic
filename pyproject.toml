[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-lab"
version = "1.0.0"
description = "Laboratoire local de simulation de trafic urbain"
requires-python = ">=3.11"
dependencies = ["eclipse-sumo>=1.24,<2", "traci>=1.24,<2", "sumolib>=1.24,<2", "pydantic>=2,<3", "websockets>=15,<18", "networkx>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
traffic = "traffic.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

